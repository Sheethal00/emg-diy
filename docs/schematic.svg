<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
:root{--bg:#ffffff;--fg:#1b1f24;--mut:#667085;--vr:#e8590c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--fg:#e6e9ee;--mut:#8b94a3;--vr:#ff922b}}
.bg{fill:var(--bg)}
.w{stroke:var(--fg);stroke-width:1.6;fill:none}
.vw{stroke:var(--vr);stroke-width:1.6;fill:none}
.b{stroke:var(--fg);stroke-width:1.6;fill:var(--bg)}
text{fill:var(--fg)}
.m{fill:var(--mut)}
.v{fill:var(--vr);font-weight:600}
.dot{fill:var(--fg)}
.s{font-size:10px}
</style>
<defs><g id="gnd"><path class="w" d="M0 0v8M-10 8h20M-6 12h12M-2 16h4"/></g></defs>
<rect class="bg" width="1000" height="640"/>
<text x="20" y="24" font-size="16" font-weight="700">1-channel sEMG front end (simplified schematic)</text>
<text x="20" y="44" class="m">INA333 (gain ≈10) → HPF 19 Hz (C1·R9) → U2B (gain ≈51, LPF 469 Hz from R7·C2) → ADS1015.  Total gain ≈513.  All stages centered on VREF = 1.65 V.</text>

<!-- inputs -->
<text x="20" y="116" font-weight="600">Electrode +</text>
<path class="w" d="M20 140H70"/><rect class="b" x="70" y="132" width="40" height="16"/><text x="90" y="164" text-anchor="middle" class="m">R3 1k</text>
<path class="w" d="M110 140H210"/>
<text x="20" y="208" font-weight="600">Electrode −</text>
<path class="w" d="M20 220H70"/><rect class="b" x="70" y="212" width="40" height="16"/><text x="90" y="244" text-anchor="middle" class="m">R4 1k</text>
<path class="w" d="M110 220H210"/>
<path class="w" d="M150 140V173M140 173h20M140 183h20M150 183V220"/>
<circle class="dot" cx="150" cy="140" r="3"/><circle class="dot" cx="150" cy="220" r="3"/>
<text x="162" y="182" class="m s">C5 10n</text>
<text x="20" y="276" class="m s">C3, C4: 1 nF from each input</text><text x="20" y="289" class="m s">to VREF (RFI filter)</text>
<text x="20" y="306" class="m s">R5, R6 (optional): 10 MΩ from</text><text x="20" y="319" class="m s">each input to VREF</text>

<!-- INA333 -->
<rect class="b" x="210" y="100" width="140" height="160"/>
<text x="280" y="168" text-anchor="middle" font-weight="700" font-size="14">U1 INA333</text>
<text x="280" y="186" text-anchor="middle" class="m s">G = 1 + 100k / Rg1</text>
<text x="216" y="144" class="s">3 VIN+</text><text x="216" y="224" class="s">2 VIN−</text>
<text x="344" y="144" class="s" text-anchor="end">6 VOUT</text><text x="344" y="224" class="s" text-anchor="end">5 REF</text>
<path class="w" d="M280 100V76"/><text x="280" y="68" text-anchor="middle" class="m">3V3A</text><text x="280" y="116" text-anchor="middle" class="s">7 V+</text>
<text x="235" y="254" text-anchor="middle" class="s">1</text><text x="280" y="254" text-anchor="middle" class="s">4 V−</text><text x="325" y="254" text-anchor="middle" class="s">8</text>
<path class="w" d="M280 260V285"/><use href="#gnd" x="280" y="285"/>
<path class="w" d="M235 260V325H255M305 325H325V260"/><rect class="b" x="255" y="317" width="50" height="16"/>
<text x="280" y="352" text-anchor="middle" class="m">Rg1 11k (pins 1–8)</text>
<path class="vw" d="M350 220H372"/><text x="376" y="224" class="v">VREF</text>

<!-- HPF -->
<path class="w" d="M350 140H410M420 140H540"/><path class="w" d="M410 125V155M420 125V155"/>
<text x="415" y="116" text-anchor="middle" class="m">C1 1µ</text>
<circle class="dot" cx="470" cy="140" r="3"/>
<path class="w" d="M470 140V165"/><rect class="b" x="462" y="165" width="16" height="40"/><path class="w" d="M470 205V225"/>
<text x="456" y="190" text-anchor="end" class="m s">R9 8.2k</text><text x="470" y="240" text-anchor="middle" class="v">VREF</text>

<!-- U2B -->
<polygon class="b" points="540,100 540,260 680,180"/>
<text x="548" y="144" font-size="14">+</text><text x="548" y="228" font-size="14">−</text>
<text x="586" y="176" font-weight="700">U2B</text><text x="586" y="192" class="m s">gain ≈ 51</text>
<text x="526" y="134" class="s m" text-anchor="end">5</text><text x="526" y="214" class="s m" text-anchor="end">6</text><text x="690" y="172" class="s m">7</text>
<circle class="dot" cx="510" cy="220" r="3"/>
<path class="w" d="M680 180H700M700 180V60H510V220H540"/>
<rect class="b" x="560" y="50" width="130" height="20"/><text x="625" y="64" text-anchor="middle" class="s">R7 49.9k ∥ C2 6.8n</text>
<path class="w" d="M510 220V245"/><rect class="b" x="502" y="245" width="16" height="40"/><path class="w" d="M510 285V300"/>
<text x="524" y="270" class="m s">R8 1k</text><text x="510" y="314" text-anchor="middle" class="v">VREF</text>
<circle class="dot" cx="700" cy="180" r="3"/>

<!-- to ADC -->
<path class="w" d="M700 180H740"/><rect class="b" x="740" y="172" width="40" height="16"/><text x="760" y="166" text-anchor="middle" class="m s">R10 1k</text>
<path class="w" d="M780 180H830"/>
<rect class="b" x="830" y="110" width="140" height="150"/>
<text x="900" y="138" text-anchor="middle" font-weight="700" font-size="14">U3 ADS1015</text>
<text x="900" y="154" text-anchor="middle" class="m s">ch1: ADDR → GND (0x48)</text>
<text x="836" y="184" class="s">A0</text><text x="836" y="224" class="s">A1</text>
<text x="900" y="250" text-anchor="middle" class="s">SDA GPIO21 · SCL GPIO22</text>
<path class="vw" d="M830 220H812"/><text x="808" y="224" text-anchor="end" class="v">VREF</text>
<text x="830" y="278" class="m s">Unused A2, A3 → VREF</text><text x="830" y="292" class="m s">I²C → ESP32 → Bluetooth</text>

<!-- VREF generator -->
<path class="w" d="M20 372H980" stroke-dasharray="4 4" opacity=".4"/>
<text x="20" y="396" font-weight="700">VREF generator (1.65 V) and reference electrode</text>
<text x="120" y="420" text-anchor="middle" class="m">3V3A</text><path class="w" d="M120 426V440"/>
<rect class="b" x="112" y="440" width="16" height="40"/><text x="104" y="464" text-anchor="end" class="m s">R1 10k</text>
<path class="w" d="M120 480V500"/><circle class="dot" cx="120" cy="490" r="3"/>
<rect class="b" x="112" y="500" width="16" height="40"/><text x="104" y="524" text-anchor="end" class="m s">R2 10k</text>
<path class="w" d="M120 540V556"/><use href="#gnd" x="120" y="556"/>
<path class="w" d="M120 490H170V510M160 510h20M160 518h20M170 518V556"/><use href="#gnd" x="170" y="556"/>
<circle class="dot" cx="170" cy="490" r="3"/><text x="180" y="530" class="m s">C6</text><text x="180" y="542" class="m s">1µ</text>
<path class="w" d="M170 490H200V465H240"/>
<polygon class="b" points="240,440 240,540 320,490"/>
<text x="248" y="469" font-size="14">+</text><text x="248" y="521" font-size="14">−</text>
<text x="262" y="494" class="s">U2A</text><text x="256" y="508" class="m s">buffer</text>
<path class="w" d="M240 515H210V570H340V490"/>
<path class="w" d="M320 490H340"/><circle class="dot" cx="340" cy="490" r="3"/>
<path class="vw" d="M340 490H372"/><text x="376" y="494" class="v">VREF</text>
<path class="w" d="M340 490V440H360"/><rect class="b" x="360" y="432" width="40" height="16"/><text x="380" y="426" text-anchor="middle" class="m s">R11 10k</text>
<path class="w" d="M400 440H430"/><text x="436" y="444" font-weight="600">Reference electrode (bony site)</text>

<text x="560" y="500" class="m s">VREF feeds: U1 pin 5 (REF), R5/R6, C3/C4, R8, R9, U3 A1/A2/A3, R11.</text>
<text x="560" y="516" class="m s">0.1 µF at every IC supply pin; 10 µF bulk on 3V3A.</text>
<text x="560" y="532" class="m s">Wearable power: LiPo → switch → fuse → 3.3 V regulator → J1 → 3V3.</text>
<text x="560" y="548" class="m s">3V3A = 3V3 through a ferrite bead + 10 µF (keeps radio noise off the analog side).</text>
<text x="560" y="564" class="m s">Bench power: USB on the ESP32 only, J1 open, no electrodes on you.</text>
</svg>
