<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Breadboard Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a workbench. Selectors on top, ESD mat with hardware on the left, step sheet on the right, code and serial below. */
:root{
  --bg:#e6ebe8;--panel:#f7f9f7;--ink:#172524;--muted:#526462;--line:#c4cfcb;--mat:#55716f;
  --accent:#8f5400;--accent-fill:#f3a722;--on-accent:#231500;--ok:#17734a;--bad:#ad2a1e;--soft:#eef2ef;--warnbg:#fbe9e4;--expbg:#fdf3dc;--code:#1b2928;--codefg:#dcebe5;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141d1c;--panel:#1c2726;--ink:#e6efeb;--muted:#9db0ab;--line:#35453f;--mat:#2d4442;
  --accent:#f6b444;--accent-fill:#f3a722;--on-accent:#231500;--ok:#5fd29c;--bad:#ff8d7e;--soft:#243130;--warnbg:#3b211d;--expbg:#33290f;--code:#0f1716;--codefg:#dcebe5;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141d1c;--panel:#1c2726;--ink:#e6efeb;--muted:#9db0ab;--line:#35453f;--mat:#2d4442;
  --accent:#f6b444;--accent-fill:#f3a722;--on-accent:#231500;--ok:#5fd29c;--bad:#ff8d7e;--soft:#243130;--warnbg:#3b211d;--expbg:#33290f;--code:#0f1716;--codefg:#dcebe5;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
.wrap{max-width:1420px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
header{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end}
h1{font:700 30px/1 var(--display);letter-spacing:.01em;margin:0 8px 3px 0}
label.f{display:grid;gap:2px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
label.f{max-width:100%}label.f select{width:100%}
select{font:500 14px var(--body);padding:7px 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;color:var(--ink);font:500 14px var(--body);padding:7px 11px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-fill);color:var(--on-accent);font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.timeline{display:flex;gap:4px;overflow-x:auto;padding-block:2px}
.timeline button{flex:none;display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:4px;padding:4px 9px 4px 5px;font:500 13px var(--body);cursor:pointer;max-width:190px}
.timeline span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeline b{font:500 12px var(--mono);width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:var(--soft);color:var(--ink);flex:none}
.timeline .done b{background:var(--ok);color:var(--panel)}
.timeline .cur{border-color:var(--accent);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:12px;align-items:start}
.left{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;min-width:0}
.stage{background:var(--mat);border-radius:6px;min-width:0;overflow:hidden}
.scroll{overflow-x:auto}
#svg{display:block;width:100%;min-width:760px;height:auto;touch-action:manipulation;user-select:none}
#svg.full{min-width:1240px}
.probe{display:flex;flex-wrap:wrap;gap:4px 14px;background:var(--panel);border:1px solid var(--line);border-top:0;padding:7px 12px;font-size:13px;border-radius:0 0 6px 6px;min-height:36px;align-items:center}
.probe .v{font:500 14px var(--mono);color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px}
.tools label{display:flex;gap:5px;align-items:center;cursor:pointer}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px;min-width:0}
.eyebrow{font:500 12px var(--mono);color:var(--muted)}
h2{font:600 25px/1.12 var(--display);margin:2px 0 0;text-wrap:balance}
.do{font-weight:500;margin:0}.why{margin:0;color:var(--muted);font-size:14px}
.expect{background:var(--expbg);border-radius:4px;padding:10px 12px;display:grid;gap:8px}
.expect h3,.sec{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--accent)}
.sec{color:var(--muted)}
.expect p{margin:0;font-size:14px}
table.ck{width:100%;border-collapse:collapse;font-size:13px}
table.ck th{font-weight:500;color:var(--muted);text-align:left;padding:2px 6px 2px 0;border-bottom:1px solid var(--line)}
table.ck td{padding:4px 6px 4px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.ck td.n{font:13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}.wait{color:var(--muted)}
.mistake{font-size:13px;color:var(--muted);margin:0}.mistake b{color:var(--ink);font-weight:600}
.warn{background:var(--warnbg);color:var(--bad);border-radius:4px;padding:8px 11px;font-size:14px;font-weight:500}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:8px 13px;border-radius:4px;font:500 14px var(--body);cursor:pointer}
.btn.pri{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent);font-weight:600;flex:1}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:5px 9px;font-size:13px}.btn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ctrl{display:grid;gap:8px}.ctrl label{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:13px}
.ctrl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent-fill)}
.feedback{font-size:14px;border-radius:4px;padding:8px 11px;background:var(--soft)}
.feedback.bad{background:var(--warnbg);color:var(--bad)}
.feedback.good{color:var(--ok);font-weight:500}
.lower{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px}
.term{background:var(--code);color:var(--codefg);border-radius:6px;min-width:0;display:flex;flex-direction:column;min-height:170px}
.term .bar{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 12px;font:600 12px var(--body);letter-spacing:.05em;text-transform:uppercase}
.term .bar button{background:none;border:1px solid currentColor;color:inherit;border-radius:3px;font:500 12px var(--body);padding:2px 8px;cursor:pointer}
.term pre{margin:0;padding:0 12px 12px;font:12.5px/1.5 var(--mono);overflow:auto;max-height:290px;flex:1}
.free-note{font-size:14px;margin:0}
.viewbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.viewbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.viewbar input[type=range]{width:96px;accent-color:var(--accent-fill)}
.viewbar small{flex-basis:100%;color:var(--muted);font-size:12.5px}
.scroll.rot{position:relative;overflow:hidden}
.scroll.rot #svg{position:absolute;left:50%;top:50%;min-width:0!important;transform-style:flat}
#svg.dragging{cursor:grab;touch-action:none}
#svg.under text{display:none}
#svg.under .stripbar{fill:rgba(196,122,38,.85)}
#svg.under [data-el]{opacity:.22}
.meter{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:13px}
.lcd{font:500 24px/1 var(--mono);background:#b9c6a8;color:#1b2415;padding:7px 10px;border-radius:3px;min-width:104px;text-align:right;font-variant-numeric:tabular-nums}
.meter small{font-size:12.5px;color:var(--muted);flex:1 1 180px;min-width:0}
#trace{display:block;margin:0 12px 8px;width:calc(100% - 24px);height:auto}
.bench-note{font-size:12.5px;color:var(--muted);margin:0}
.hole{fill:#39403f}.hit{fill:transparent;cursor:crosshair}
.hit:hover{fill:rgba(243,167,34,.55)}
.pinhit{fill:transparent;cursor:crosshair}.pinhit:hover{fill:rgba(243,167,34,.7)}
.wirehalo{fill:none;stroke:rgba(0,0,0,.28);stroke-width:5.5;stroke-linecap:round}
.wire{fill:none;stroke-width:3.6;stroke-linecap:round}
.flow{fill:none;stroke:#fff;stroke-width:1.5;stroke-dasharray:3 9;stroke-linecap:round;opacity:0;pointer-events:none}
.flow.f{opacity:.95;animation:df .55s linear infinite}.flow.r{opacity:.95;animation:dr .55s linear infinite}
@keyframes df{to{stroke-dashoffset:-12}}@keyframes dr{to{stroke-dashoffset:12}}
.hlbar{fill:rgba(243,167,34,.42);stroke:#b86f00;stroke-width:1.2;pointer-events:none}
.pulse{animation:pl 1.1s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
.stripbar{fill:rgba(190,120,30,.22);pointer-events:none}
.clickable{cursor:pointer}
@media (prefers-reduced-motion:reduce){.flow.f,.flow.r,.pulse{animation:none}}
@media (max-width:1040px){.main{grid-template-columns:minmax(0,1fr)}.left{display:contents}.sheet{order:2}.lower{order:3}}
@media (max-width:720px){.lower{grid-template-columns:minmax(0,1fr)}h1{width:100%}header label.f{flex:1 1 42%}}
</style>
<div class="wrap">
<header>
  <h1>Breadboard Bench</h1>
  <label class="f" for="sBoard">Controller board<select id="sBoard"></select></label>
  <label class="f" for="sBB">Breadboard<select id="sBB"><option value="half">Half size, 400 points</option><option value="full">Full size, 830 points</option><option value="split">Full size, rails split at column 30</option></select></label>
  <label class="f" for="sLesson">Circuit<select id="sLesson"></select></label>
  <div class="seg" role="group" aria-label="How you want to work" id="modes">
    <button data-m="watch">Watch steps</button><button data-m="do">Wire it yourself</button><button data-m="free">Free build</button>
  </div>
</header>
<div class="timeline" id="timeline" aria-label="Steps"></div>
<div class="main">
  <div class="left">
    <div>
      <div class="stage"><div class="scroll"><svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Controller board and breadboard with the current wiring"></svg></div></div>
      <div class="probe" id="probe"></div>
    </div>
    <div class="tools">
      <label><input type="checkbox" id="cStrips"> Show the metal strips inside the board</label>
      <label><input type="checkbox" id="cPower" checked> USB power on</label>
    </div>
    <div class="viewbar" id="viewbar">
      <strong>Rotate board</strong>
      <button class="btn sm" data-v="left">Turn left 90°</button><button class="btn sm" data-v="right">Turn right 90°</button><button class="btn sm" data-v="flip">Flip to underside</button><button class="btn sm" data-v="reset">Reset view</button>
      <label><input type="checkbox" id="cDrag"> Drag board to rotate</label>
      <label for="vx">Tilt <input id="vx" type="range" min="-180" max="180" value="0"></label>
      <label for="vy">Swivel <input id="vy" type="range" min="-180" max="180" value="0"></label>
      <label for="vz">Turn <input id="vz" type="range" min="-180" max="180" value="0"></label>
      <small id="viewnote" hidden>Underside view, mirror image. The copper bars show which holes are joined.</small>
    </div>
    <div class="meter" id="meter"></div>
    <div class="lower">
      <div class="term"><div class="bar"><span id="codeTitle">Code</span><button id="copy">Copy</button></div><pre id="code"></pre></div>
      <div class="term"><div class="bar"><span>Serial monitor</span></div><svg id="trace" viewBox="0 0 300 84" hidden aria-label="Live ADS1015 counts"></svg><pre id="serial" aria-live="polite"></pre></div>
    </div>
  </div>
  <aside class="sheet" id="sheet"></aside>
</div>
</div>
<script>
"use strict";
/* ---------- Boards ---------- */
const P=(id,label,type,v)=>({id,label:label||id,type:type||'io',v});
const BOARDS={
 uno:{name:'Arduino Uno',vcc:5,lang:'cpp',mcu:true,color:'#0f7f8c',
  top:[P('AREF','AREF','nc'),P('GND2','GND','gnd'),...[13,12,11,10,9,8,7,6,5,4,3,2].map(n=>P('D'+n))],
  bottom:[P('IOREF','IOREF','nc'),P('RESET','RST','nc'),P('3V3','3V3','pwr',3.3),P('5V','5V','pwr'),P('GND','GND','gnd'),P('GND1','GND','gnd'),P('VIN','VIN','nc'),...[0,1,2,3,4,5].map(n=>P('A'+n))],
  roles:{POWER:'5V',GND:'GND',OUT:'D9',OUT2:'D10',OUT3:'D11',IN:'D2',ADC:'A0'},num:{OUT:9,OUT2:10,OUT3:11,IN:2,ADC:'A0'},adc:1023},
 esp32:{name:'ESP32 DevKit V1',vcc:3.3,lang:'cpp',mcu:true,color:'#20252b',
  left:['VIN','GND','D13','D12','D14','D27','D26','D25','D33','D32','D35','D34','VN','VP','EN'].map(l=>l==='GND'?P('GND','GND','gnd'):P(l,l,['VIN','VN','VP','EN'].includes(l)?'nc':'io')),
  right:['3V3','GND2','D15','D2','D4','RX2','TX2','D5','D18','D19','D21','RX0','TX0','D22','D23'].map(l=>l==='3V3'?P('3V3','3V3','pwr'):l==='GND2'?P('GND2','GND','gnd'):P(l,l,['RX0','TX0'].includes(l)?'nc':'io')),
  roles:{POWER:'3V3',GND:'GND2',OUT:'D18',OUT2:'D19',OUT3:'D21',IN:'D4',ADC:'D34'},num:{OUT:18,OUT2:19,OUT3:21,IN:4,ADC:34},adc:4095},
 pico:{name:'Raspberry Pi Pico',vcc:3.3,lang:'py',mcu:true,color:'#1d6b43',
  left:['GP0','GP1','GND','GP2','GP3','GP4','GP5','GND3','GP6','GP7','GP8','GP9','GND4','GP10','GP11','GP12','GP13','GND5','GP14','GP15'].map(l=>/^GND/.test(l)?P(l,'GND','gnd'):P(l)),
  right:['VBUS','VSYS','GND6','3V3_EN','3V3','ADC_VREF','GP28','AGND','GP27','GP26','RUN','GP22','GND7','GP21','GP20','GP19','GP18','GND8','GP17','GP16'].map(l=>/^(GND|AGND)/.test(l)?P(l,l==='AGND'?'AGND':'GND','gnd'):l==='3V3'?P('3V3','3V3 OUT','pwr'):['VBUS','VSYS','3V3_EN','ADC_VREF','RUN'].includes(l)?P(l,l,'nc'):P(l)),
  roles:{POWER:'3V3',GND:'GND6',OUT:'GP15',OUT2:'GP14',OUT3:'GP13',IN:'GP16',ADC:'GP26'},num:{OUT:15,OUT2:14,OUT3:13,IN:16,ADC:26},adc:65535},
 esp38:{name:'ESP32 DevKit 38-pin',vcc:3.29,lang:'cpp',mcu:true,color:'#20252b',
  left:['3V3','EN','VP','VN','IO34','IO35','IO32','IO33','IO25','IO26','IO27','IO14','IO12','GND','IO13','SD2','SD3','CMD','5V'].map(l=>l==='3V3'?P(l,l,'pwr'):l==='GND'?P(l,l,'gnd'):l==='5V'?P(l,l,'pwr',5):['EN','VP','VN','SD2','SD3','CMD'].includes(l)?P(l,l,'nc'):P(l)),
  right:['GND2','IO23','IO22','TX','RX','IO21','GND3','IO19','IO18','IO5','IO17','IO16','IO4','IO0','IO2','IO15','SD1','SD0','CLK'].map(l=>/^GND/.test(l)?P(l,'GND','gnd'):['TX','RX','SD1','SD0','CLK'].includes(l)?P(l,l,'nc'):P(l)),
  roles:{POWER:'3V3',GND:'GND',OUT:'IO18',OUT2:'IO19',OUT3:'IO23',IN:'IO4',ADC:'IO34'},num:{OUT:18,OUT2:19,OUT3:23,IN:4,ADC:34},adc:4095},
 supply:{name:'5 V power module (no code)',vcc:5,lang:null,mcu:false,color:'#7b2332',
  right:[P('5V','+5V','pwr'),P('GND','GND','gnd')],roles:{POWER:'5V',GND:'GND'},num:{}}
};
/* ---------- Lessons ---------- */
const wire=(a,b,color,o)=>({t:'wire',a,b,color,...o});
const part=(p,o)=>({t:'part',part:p,...o});
const R=(id,a,b,value)=>({kind:'r',id,a,b,value});
const LED=(id,a,b,color)=>({kind:'led',id,a,b,color});
const railP=()=>wire('pin:POWER','t+:2','#d3322a',{title:'Power to the + rail',do:'Connect {POWER} to the top + rail, hole 2.',why:'The whole red + line is one long conductor, so this one wire makes {VCC} available along the entire rail.',expect:'The far end of the + rail now reads {VCC}. Nothing lights up, because nothing is connected to the rail yet.',checks:[{at:'t+:28',v:'VCC',label:'+ rail, far end'}],mistake:'Plugging into the blue − rail by accident. Check the colour line beside the holes.'});
const railG=(noPlus)=>wire('pin:GND','t-:2','#23262a',{title:'Ground to the − rail',do:'Connect {GND} to the top − rail, hole 2.',why:'Ground is the return path. Current has to get back to the board or nothing flows.',expect:noPlus?'The whole − rail reads 0 V. This circuit takes its power from a code-controlled pin, so the + rail stays unused.':'The − rail reads 0 V. The + rail stays at {VCC}.',checks:noPlus?[{at:'t-:28',v:0,label:'− rail, far end'}]:[{at:'t-:28',v:0,label:'− rail, far end'},{at:'t+:28',v:'VCC',label:'+ rail, far end'}],mistake:'Leaving ground out. Rail voltages look fine on the power side but no circuit will ever work.'});
const LEDFAULTS=[
 {label:'Flip the LED',f:{swap:'D1'},say:'The LED blocks current when reversed, so it stays dark and nothing is damaged. Turn it around so the long leg faces the positive side.'},
 {label:'Leave out the resistor',f:{short:'R1'},say:'Without a resistor only the LED and the supply limit the current. It rises far past the 20 to 30 mA an LED tolerates, and a real LED can fail in moments.'}];
const LESSONS=[
{id:'tour',name:'Breadboard tour: how the holes connect',mcu:false,steps:[
 {t:'look',hl:['t+','t-'],title:'The power rails',do:'Find the red and blue lines along the top edge.',why:'Each line marks one long metal strip. Every hole along the red line is connected, and every hole along the blue line is connected. Red and blue are not connected to each other.',expect:'There are 4 rails in total: + and − at the top, + and − at the bottom. Top and bottom rails are separate until you join them.',mistake:'Some full-size boards split the rails halfway. If the far end reads 0 V, add a short jumper across the break.'},
 {t:'look',hl:['u10'],title:'A row group: a to e',do:'Look at column 10. Holes a, b, c, d and e are highlighted.',why:'These five holes sit on one metal clip. Anything plugged in here is connected. That is how parts join without solder.',expect:'Two legs in holes 10a and 10c are connected. Two legs in 10a and 11a are not.',mistake:'Putting both legs of a part in the same group. The part gets bypassed and does nothing.'},
 {t:'look',hl:['u10','l10'],title:'The centre gap',do:'See the two highlighted groups, one above the gap and one below.',why:'The gap breaks each column into two groups: a to e and f to j. Chips straddle this gap so each of their pins gets its own group.',expect:'10e and 10f look close but they are not connected.',mistake:'Assuming a column runs top to bottom across the gap. It does not.'},
 railP(),railG(),
 wire('t+:10','10a','#d3322a',{title:'Bring power to a row',do:'Connect the + rail at hole 10 to hole 10a.',why:'Now the a to e group of column 10 is part of the {VCC} net.',expect:'All of 10a to 10e read {VCC}. Hole 10f has no connection, because the gap stops it.',checks:[{at:'10e',v:'VCC',label:'Hole 10e'},{at:'10f',v:'float',label:'Hole 10f, across the gap'}],mistake:'Not pushing the wire fully in. A loose wire reads like an open circuit.'}),
 wire('10e','10f','#e7a117',{title:'Jump across the gap',do:'Connect hole 10e to hole 10f.',why:'A jumper is the only way to join the two halves of a column.',expect:'Now 10f to 10j also read {VCC}. Try tapping other holes to see which ones changed.',checks:[{at:'10j',v:'VCC',label:'Hole 10j'},{at:'11a',v:'float',label:'Hole 11a, next column'}],mistake:'Expecting column 11 to change too. Neighbouring columns stay separate.'})
]},
{id:'led',name:'Light an LED',mcu:false,faults:LEDFAULTS,steps:[
 railP(),railG(),

TXT.fw="// Set USE_BT 0 for this test. Serial Monitor: 921600 baud.\n// DIY sEMG streamer: ESP32 + ADS1015 (differential AIN0-AIN1), 1 kHz, text lines \"micros,counts\"\n//\n// Sampling runs in loop() at exactly 1 kHz and puts samples in a ring buffer.\n// A separate task sends the buffer out in small batches, so a slow or stalled\n// Bluetooth link delays delivery but never stops the sampling.\n#include <Wire.h>\n\n#define USE_BT 0   // 1 = Bluetooth (use for body recordings). 0 = USB serial (bench tests ONLY, no electrodes on you)\n\n#if USE_BT\n#include \"BluetoothSerial.h\"\nBluetoothSerial bt;\n#endif\nStream* out;\n\nconst uint8_t ADS_ADDR = 0x48;\nconst uint32_t PERIOD_US = 1000;  // 1 kHz output\nuint32_t nextT;\n\n// ---- ring buffer: loop() writes, sendTask() reads ----\nconst uint16_t QN = 2048;          // about 2 s of samples\nstruct Sample { uint32_t t; int16_t v; };\nSample q[QN];\nvolatile uint16_t qHead = 0;       // next slot to write (sampler only)\nvolatile uint16_t qTail = 0;       // next slot to read (sender only)\nvolatile uint32_t dropped = 0;     // samples lost because the buffer was full\n\nvoid adsConfig() {\n  // 0x0483: continuous, AIN0-AIN1, +/-2.048 V, 1600 SPS, comparator off\n  Wire.beginTransmission(ADS_ADDR);\n  Wire.write(0x01); Wire.write(0x04); Wire.write(0x83);\n  Wire.endTransmission();\n  Wire.beginTransmission(ADS_ADDR);   // point to conversion register\n  Wire.write(0x00);\n  Wire.endTransmission();\n}\n\nint16_t adsRead() {\n  Wire.requestFrom(ADS_ADDR, (uint8_t)2);\n  int16_t v = (Wire.read() << 8) | Wire.read();\n  return v >> 4;  // 12-bit, 1 mV/count at +/-2.048 V\n}\n\nvoid sendTask(void*) {\n  static char buf[1600];\n  uint32_t lastDropped = 0;\n  for (;;) {\n#if USE_BT\n    if (!bt.hasClient()) {           // nobody connected: throw away stale samples\n      qTail = qHead;\n      dropped = 0;\n      lastDropped = 0;\n      vTaskDelay(pdMS_TO_TICKS(50));\n      continue;\n    }\n#endif\n    int n = 0;\n    uint16_t t = qTail;\n    while (t != qHead && n < (int)sizeof(buf) - 40) {\n      n += snprintf(buf + n, sizeof(buf) - n, \"%lu,%d\\n\",\n                    (unsigned long)q[t].t, (int)q[t].v);\n      t = (t + 1) % QN;\n    }\n    uint32_t d = dropped;\n    if (d != lastDropped && n < (int)sizeof(buf) - 40) {\n      n += snprintf(buf + n, sizeof(buf) - n, \"# dropped %lu\\n\", (unsigned long)d);\n      lastDropped = d;\n    }\n    if (n > 0) {\n      int off = 0;\n      while (off < n) {\n        size_t w = out->write((const uint8_t*)buf + off, n - off);\n        if (w == 0) vTaskDelay(1);\n        off += (int)w;\n      }\n      qTail = t;\n    }\n    vTaskDelay(pdMS_TO_TICKS(10));   // send roughly every 10 ms, about 10 samples per batch\n  }\n}\n\nvoid setup() {\n#if USE_BT\n  bt.begin(\"EMG-Logger\");\n  out = &bt;\n#else\n  Serial.begin(921600);\n  out = &Serial;\n#endif\n  Wire.begin(21, 22);\n  Wire.setClock(400000);\n  adsConfig();\n  xTaskCreatePinnedToCore(sendTask, \"send\", 4096, NULL, 1, NULL, 0);\n  nextT = micros() + PERIOD_US;\n}\n\nvoid loop() {\n  uint32_t now = micros();\n  if ((int32_t)(now - nextT) >= 0) {\n    nextT += PERIOD_US;\n    int16_t v = adsRead();\n    uint16_t h = qHead;\n    uint16_t nh = (h + 1) % QN;\n    if (nh != qTail) {\n      q[h].t = now;\n      q[h].v = v;\n      __sync_synchronize();     // make sure the sample is stored before the sender can see it\n      qHead = nh;\n    } else {\n      dropped++;\n    }\n  }\n}\n";

TXT.dac="// On your PC after upload:\n//   python emg_server.py --port /dev/ttyUSB0 --gain 1\n// EMG test rig: the normal 1 kHz sampler/sender from firmware/emg_firmware.ino, plus a test signal\n// from the ESP32's own DAC, so the whole software chain can be tested with no phone and no extra parts.\n//\n// Wiring (USB unplugged while wiring):\n//   GPIO25 (DAC1, labelled P25)  --- 1 kOhm ---  ADS1015 A0\n//   ADS1015 A1 stays on the 1.65 V divider node.   Nothing else changes.\n//\n// Use: hold the BOOT button (GPIO0) = \"muscle on\" (100 Hz sine around mid-scale). Release = rest.\n// Do NOT hold BOOT while resetting or plugging in USB (that enters the bootloader).\n//\n// Bench test only: no electrodes on your body. Output goes over USB serial (USE_BT 0).\n#include <Wire.h>\n\n#define USE_BT 0   // 0 = USB serial (this test). 1 = Bluetooth.\n#define SIGNAL_NOISE 0   // 0 = 100 Hz sine (median frequency should read about 100 Hz). 1 = random noise (EMG-like).\n\n#if USE_BT\n#include \"BluetoothSerial.h\"\nBluetoothSerial bt;\n#endif\nStream* out;\n\nconst uint8_t ADS_ADDR = 0x48;\nconst uint32_t PERIOD_US = 1000;  // 1 kHz output\nuint32_t nextT;\n\n// ---- test signal ----\nconst int DAC_PIN = 25;           // DAC1\nconst int BTN_PIN = 0;            // BOOT button, reads LOW when pressed\nconst float SIG_HZ = 100.0f;\nconst float SIG_AMP = 30.0f;      // DAC steps (about 12.9 mV each): about +/-390 mV, i.e. about +/-390 counts\nconst int NOISE_AMP = 40;         // DAC steps, used when SIGNAL_NOISE is 1\nconst int DAC_MID = 128;          // about 1.65 V, the same level as the divider node\nfloat phase = 0.0f;\n\nvoid updateDac() {\n  int v = DAC_MID;\n  if (digitalRead(BTN_PIN) == LOW) {\n#if SIGNAL_NOISE\n    v = DAC_MID + (int)(esp_random() % (2 * NOISE_AMP + 1)) - NOISE_AMP;\n#else\n    v = DAC_MID + (int)lroundf(SIG_AMP * sinf(phase));\n#endif\n  }\n  phase += 2.0f * PI * SIG_HZ / 1000.0f;   // advance one sample at 1 kHz\n  if (phase > 2.0f * PI) phase -= 2.0f * PI;\n  dacWrite(DAC_PIN, v);\n}\n\n// ---- ring buffer: loop() writes, sendTask() reads ----\nconst uint16_t QN = 2048;          // about 2 s of samples\nstruct Sample { uint32_t t; int16_t v; };\nSample q[QN];\nvolatile uint16_t qHead = 0;\nvolatile uint16_t qTail = 0;\nvolatile uint32_t dropped = 0;\n\nvoid adsConfig() {\n  // 0x0483: continuous, AIN0-AIN1, +/-2.048 V, 1600 SPS, comparator off\n  Wire.beginTransmission(ADS_ADDR);\n  Wire.write(0x01); Wire.write(0x04); Wire.write(0x83);\n  Wire.endTransmission();\n  Wire.beginTransmission(ADS_ADDR);   // point to conversion register\n  Wire.write(0x00);\n  Wire.endTransmission();\n}\n\nint16_t adsRead() {\n  Wire.requestFrom(ADS_ADDR, (uint8_t)2);\n  int16_t v = (Wire.read() << 8) | Wire.read();\n  return v >> 4;  // 12-bit, 1 mV/count at +/-2.048 V\n}\n\nvoid sendTask(void*) {\n  static char buf[1600];\n  uint32_t lastDropped = 0;\n  for (;;) {\n#if USE_BT\n    if (!bt.hasClient()) {           // nobody connected: throw away stale samples\n      qTail = qHead;\n      dropped = 0;\n      lastDropped = 0;\n      vTaskDelay(pdMS_TO_TICKS(50));\n      continue;\n    }\n#endif\n    int n = 0;\n    uint16_t t = qTail;\n    while (t != qHead && n < (int)sizeof(buf) - 40) {\n      n += snprintf(buf + n, sizeof(buf) - n, \"%lu,%d\\n\",\n                    (unsigned long)q[t].t, (int)q[t].v);\n      t = (t + 1) % QN;\n    }\n    uint32_t d = dropped;\n    if (d != lastDropped && n < (int)sizeof(buf) - 40) {\n      n += snprintf(buf + n, sizeof(buf) - n, \"# dropped %lu\\n\", (unsigned long)d);\n      lastDropped = d;\n    }\n    if (n > 0) {\n      int off = 0;\n      while (off < n) {\n        size_t w = out->write((const uint8_t*)buf + off, n - off);\n        if (w == 0) vTaskDelay(1);\n        off += (int)w;\n      }\n      qTail = t;\n    }\n    vTaskDelay(pdMS_TO_TICKS(10));   // send roughly every 10 ms\n  }\n}\n\nvoid setup() {\n#if USE_BT\n  bt.begin(\"EMG-Logger\");\n  out = &bt;\n#else\n  Serial.begin(921600);\n  out = &Serial;\n#endif\n  pinMode(BTN_PIN, INPUT_PULLUP);\n  dacWrite(DAC_PIN, DAC_MID);\n  Wire.begin(21, 22);\n  Wire.setClock(400000);\n  adsConfig();\n  xTaskCreatePinnedToCore(sendTask, \"send\", 4096, NULL, 1, NULL, 0);\n  nextT = micros() + PERIOD_US;\n}\n\nvoid loop() {\n  uint32_t now = micros();\n  if ((int32_t)(now - nextT) >= 0) {\n    nextT += PERIOD_US;\n    int16_t v = adsRead();\n    uint16_t h = qHead;\n    uint16_t nh = (h + 1) % QN;\n    if (nh != qTail) {\n      q[h].t = now;\n      q[h].v = v;\n      __sync_synchronize();\n      qHead = nh;\n    } else {\n      dropped++;\n    }\n    updateDac();                     // set the test signal for the next sample\n  }\n}\n";

  if(!ok){const want=(st.t==='part'&&st.part.kind==='led')?'the long leg group: '+describe(tg[0]):tg.map(x=>x.includes(':')&&!x.startsWith('pin:')?'the '+(x[0]==='t'?'top ':'bottom ')+(x[1]==='+'?'+':'−')+' rail':describe(x)).join(' or ');return pickWrong(`${describe(h)} is not connected to this step's target. ${descStrip(h)}. Try ${want}.`)}
  S.picks=[h];S.msg={t:`First end is in ${describe(h)}. Now choose the other end.`};renderSheet();renderPicks();return}
 const first=S.picks[0];const tg=targetStrips(st);const a=strip(first),b=strip(h);const want=tg.map(strip);
 if(h===first)return pickWrong('Pick a different hole for the second end.');
 if(occupied(h))return pickWrong(`${describe(h)} already holds another leg or wire. Use a free hole in the same group.`);
 const ok=(a===want[0]&&b===want[1])||(st.part?.kind!=='led'&&a===want[1]&&b===want[0]);
 if(a===b)return pickWrong(`Both ends are in the same metal group, so this part would be bypassed. ${descStrip(h)}.`);
 if(!ok)return pickWrong(`${describe(h)} is not the right destination. ${descStrip(h)}. This end belongs in ${describe(want[0]===a?tg[1]:tg[0])}.`);
 place({a:first,b:h})}
function place(o){const i=S.built;if(o)S.over[i]=o;S.picks=[];S.msg=null;S.hint=false;S.built=i+1;S.phase='result';refresh()}
function freePick(h){const t=S.tool;if(t==='del')return;
 if(t==='btn'){const m=h.match(/^(\d+)[a-j]$/);if(!m||+m[1]+2>cols())return flash('Click a column in the main area, at least 2 from the right end.');const c=+m[1];const legs=[`${c}e`,`${c}f`,`${c+2}e`,`${c+2}f`];if(legs.some(occupied))return flash('Those holes are already in use.');return addFree({kind:'btn',id:'S'+nextId(),col:c})}
 if(t==='pot'){const m=h.match(/^(\d+)([a-j])$/);if(!m||+m[1]+2>cols())return flash('Click a hole in the main area.');const c=+m[1],l=m[2];if([0,1,2].some(i=>occupied(c+i+l)))return flash('Those holes are already in use.');return addFree({kind:'pot',id:'RV'+nextId(),col:c,row:l})}
 if(occupied(h)&&!S.picks.length)return flash(`${describe(h)} is already in use.`);
 if(!S.picks.length){S.picks=[h];S.msg={t:`First end: ${describe(h)}. Choose the second.`};renderSheet();renderPicks();return}
 const a=S.picks[0];if(a===h){S.picks=[];S.msg=null;renderSheet();renderPicks();return}if(occupied(h))return flash(`${describe(h)} is already in use.`);
 const e=t==='wire'?{kind:'wire',id:'F'+nextId(),a,b:h,color:['#2b6fd6','#e7a117','#23a455','#d3322a','#8d6be0'][S.fid%5]}:t==='r'?{kind:'r',id:'R'+(100+nextId()),a,b:h,value:S.rval}:{kind:'led',id:'D'+(100+nextId()),a,b:h,color:S.ledc};addFree(e)}
const nextId=()=>++S.fid;
function flash(t){S.msg={t,bad:true};S.picks=[];renderSheet();renderPicks();solve();updateDyn()}
function addFree(e){S.free.push(e);S.picks=[];S.msg=null;refresh()}
/* ---------- Events ---------- */
const svg=$('svg');
svg.addEventListener('pointerover',e=>{const h=e.target.dataset&&e.target.dataset.h;if(h)setHover(h)});
svg.addEventListener('pointerout',e=>{if(e.target.dataset&&e.target.dataset.h)setHover(null)});
svg.addEventListener('click',e=>{if(S.viewDrag)return;const h=e.target.dataset&&e.target.dataset.h;if(S.mode==='free'&&S.tool==='del'){const g=e.target.closest('[data-el]');if(g){const id=g.dataset.el;if(S.free.some(f=>f.id===id))S.free=S.free.filter(f=>f.id!==id);else S.removed.add(id);refresh()}return}
 if(h)clickHole(h)});
const press=(id,on)=>{if(on&&id==='BOOT')S.bootClick=true;if(on)S.pressed[id]=true;else delete S.pressed[id];dirty=true};
document.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-btn],[data-press]');if(b){const id=b.dataset.btn||b.dataset.press;press(id,true);S.holding=id}});
document.addEventListener('pointerup',()=>{if(S.holding){press(S.holding,false);S.holding=null}});
document.addEventListener('pointercancel',()=>{if(S.holding){press(S.holding,false);S.holding=null}});
$('sheet').addEventListener('input',e=>{const id=e.target.dataset.ctl;if(id){S.ctrl[id]=e.target.value/100;const v=$('cv_'+id);if(v)v.textContent=e.target.value+'%';dirty=true}});
$('sheet').addEventListener('change',e=>{if(e.target.id==='rv')S.rval=+e.target.value;if(e.target.id==='lc')S.ledc=e.target.value});
$('sheet').addEventListener('click',e=>{const t=e.target;const id=t.id,d=t.dataset;
 if(id==='next'){stopAuto();goto(S.built+1)}if(id==='back'){stopAuto();goto(S.built-1)}
 if(id==='auto'){if(S.auto){stopAuto()}else{S.auto=setInterval(()=>{if(S.built>=L().steps.length){stopAuto();renderSheet();return}goto(S.built+1)},4500)}renderSheet()}
 if(id==='cont'){S.phase='place';refresh()}
 if(id==='doact'){S.built++;S.phase='result';refresh()}
 if(id==='hint'){S.hint=!S.hint;refresh()}
 if(id==='skip'){const st=L().steps[S.built];if(st){S.picks=[];place(null)}}
 if(id==='again'){setMode('do')}
 if(id==='undo'){if(S.free.length){S.free.pop();refresh()}}
 if(id==='clear'){S.free=[];S.removed=new Set(elements().map(x=>x.id));S.stopCode=true;S.manual={};refresh()}
 if(d.go){setMode(d.go)}
 if(d.tool){S.tool=d.tool;S.picks=[];S.msg=null;renderSheet();renderPicks();solve();updateDyn()}
 if(d.fault!==undefined){const i=+d.fault;if(i<0){S.fault=null;S.faultIdx=null}else{S.fault=L().faults[i].f;S.faultIdx=i}refresh()}
 if(d.pin){const v=d.pv===''?undefined:+d.pv;if(v===undefined)delete S.manual[d.pin];else S.manual[d.pin]=v;refresh()}
});
$('viewbar').addEventListener('click',e=>{const v=e.target.dataset.v;if(v==='left')setView({z:VIEW.z-90});if(v==='right')setView({z:VIEW.z+90});if(v==='flip')setView({y:VIEW.y+180});if(v==='reset')setView({x:0,y:0,z:0})});
['x','y','z'].forEach(k=>$('v'+k).addEventListener('input',e=>setView({[k]:+e.target.value})));
$('cDrag').addEventListener('change',e=>{S.viewDrag=e.target.checked;svg.classList.toggle('dragging',S.viewDrag)});
let dragAt=null;svg.addEventListener('pointerdown',e=>{if(!S.viewDrag)return;dragAt=[e.clientX,e.clientY];try{svg.setPointerCapture(e.pointerId)}catch(_){}});
svg.addEventListener('pointermove',e=>{if(!dragAt)return;const dx=e.clientX-dragAt[0],dy=e.clientY-dragAt[1];dragAt=[e.clientX,e.clientY];setView({x:VIEW.x-dy*.5,y:VIEW.y+dx*.5})});
svg.addEventListener('pointerup',()=>{dragAt=null});svg.addEventListener('pointercancel',()=>{dragAt=null});
addEventListener('resize',applyView);
$('meter').addEventListener('click',e=>{const d=e.target.dataset;if(d.mm){S.meter.mode=d.mm;renderMeter()}if(d.arm){S.meter.arm=S.meter.arm===d.arm?null:d.arm;renderMeter()}});
$('timeline').addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(!b)return;if(S.mode==='watch'){stopAuto();goto(+b.dataset.step+1)}});
$('modes').addEventListener('click',e=>{const m=e.target.dataset.m;if(m)setMode(m)});
$('cStrips').addEventListener('change',e=>{S.strips=e.target.checked;refresh()});
$('cPower').addEventListener('change',e=>{S.power=e.target.checked;dirty=true});
$('copy').addEventListener('click',async()=>{const b=$('copy');try{await navigator.clipboard.writeText($('code').textContent);b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)}catch(_){const r=document.createRange();r.selectNodeContents($('code'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected'}});
function fillSelects(){$('sBB').value=S.bb;$('sBoard').innerHTML=Object.entries(BOARDS).map(([k,b])=>`<option value="${k}">${b.name}${b.vcc?` (${b.vcc===3.29?3.3:b.vcc} V)`:''}</option>`).join('');$('sBoard').value=S.board;fillLessons()}
function fillLessons(){const op=l=>`<option value="${l.id}" ${l.mcu&&!B().mcu&&!l.force?'disabled':''}>${l.name}${l.mcu&&!B().mcu&&!l.force?' (needs a programmable board)':''}</option>`;$('sLesson').innerHTML=`<optgroup label="Your Day 1 tests">${LESSONS.filter(l=>l.group).map(op).join('')}</optgroup><optgroup label="Learning circuits">${LESSONS.filter(l=>!l.group).map(op).join('')}</optgroup>`;$('sLesson').value=S.lesson;$('sBB').disabled=!!L().force}
$('sBoard').addEventListener('change',e=>{S.board=e.target.value;if((L().mcu&&!B().mcu)||(L().force&&L().force.board!==S.board))S.lesson='led';fillLessons();const m=S.mode;resetLesson(m==='do'?0:1);refresh()});
$('sBB').addEventListener('change',e=>{S.bb=e.target.value;refresh()});
$('sLesson').addEventListener('change',e=>{S.lesson=e.target.value;const fc=L().force;if(fc){S.board=fc.board;S.bb=fc.bb;$('sBoard').value=S.board;$('sBB').value=S.bb}fillLessons();const m=S.mode;resetLesson(m==='do'?0:1);refresh()});
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(S.mode==='watch'){if(e.key==='ArrowRight'){stopAuto();goto(S.built+1)}if(e.key==='ArrowLeft'){stopAuto();goto(S.built-1)}}});
fillSelects();refresh();setInterval(tick,50);
window.__bb={VIEW,setView,api,meterRead,S,LESSONS,BOARDS,evalCheck,curStep,refresh,solve,get SOL(){return SOL},res};
